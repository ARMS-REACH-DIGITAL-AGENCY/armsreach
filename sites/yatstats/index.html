<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Tour the YAT?STATS online baseball communities: for high school coaches and boosters, active alumni players, community partners and sponsors, and families and fans.">
<link rel="canonical" href="https://yatstats.com/">
<meta name="theme-color" content="#000000">
<title>Welcome to YAT?STATS</title>
<!-- The yatstats.com splash: the visitor picks the guided tour that fits
     them. Each icon opens that audience's tour (programs/, players/,
     partners/, fans/). Links are relative so the same file works at
     yatstats.com and on the agency preview (/sites/yatstats/). -->
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#000;color:#fff}
  body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
       font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
  .splash{width:100%;max-width:1100px;padding:48px 12px 56px;text-align:center}
  html,body{overflow-x:hidden}
  .welcome{margin:0 0 clamp(14px,3vh,26px);font-size:clamp(19px,4.6vw,34px);font-weight:700;letter-spacing:.02em}
  .logo{display:block;width:min(84vw,760px);height:auto;margin:0 auto}
  .tagline{margin:clamp(16px,3vh,28px) 0 0;font-size:clamp(14px,4vw,32px);font-weight:700;letter-spacing:0;white-space:nowrap}
  .fit{margin:clamp(56px,12vh,120px) 0 clamp(20px,4vh,36px);font-size:clamp(13px,2.6vw,20px);font-weight:500;color:#ddd}
  /* The four tour icons sit on an LED board like the school sites' footer
     ticker, a strip running from one edge of the screen to the other:
     unlit amber dots on black, the icons lit up on it (their own dark
     squares blend in). The descriptions sit below the board in plain
     type. The board is drawn behind the icons' row, so each icon and its
     description stay one link. One row on every screen. */
  .tours-area{--icon:clamp(46px,12vw,92px);--pad:4px;position:relative}
  .tours-area::before{content:"";position:absolute;top:0;left:calc(50% - 50vw);width:100vw;height:calc(var(--icon) + var(--pad) * 2);
         background-color:#000;background-image:radial-gradient(rgba(255,160,40,.075) 1px,transparent 1.5px);background-size:4px 4px;
         border-top:1px solid #2a1c0b;border-bottom:1px solid #2a1c0b;box-sizing:border-box;
         box-shadow:inset 0 4px 8px -4px rgba(255,170,60,.14),inset 0 -4px 8px -4px rgba(255,170,60,.14),0 0 16px rgba(255,150,40,.06)}
  .tours{position:relative;list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;max-width:980px}
  .tours li{display:flex;justify-content:center;min-width:0}
  .tour{display:flex;flex-direction:column;align-items:center;gap:calc(var(--pad) + 12px);padding:var(--pad) 4px 6px;color:#fff;
        text-decoration:none;border-radius:10px;outline-offset:4px}
  .tour img{width:var(--icon);height:var(--icon);object-fit:contain;mix-blend-mode:lighten;
            transition:transform .2s ease,filter .2s ease}
  .tour span{font-size:clamp(8.5px,2vw,13px);line-height:1.4;font-weight:500;color:#ddd;text-transform:uppercase}
  .tour .nw{white-space:nowrap}
  .tour:hover img,.tour:focus-visible img{transform:scale(1.04);filter:brightness(1.25) drop-shadow(0 0 14px rgba(255,170,60,.55))}
  .tour:hover span,.tour:focus-visible span{color:#ffc46b}
  /* Phones: all four still on one row; the descriptions get every pixel. */
  @media (max-width:520px){
    .tours{gap:0}
    .tour{padding-left:0;padding-right:0}
    .tour span{font-size:8.5px;letter-spacing:-.01em;line-height:1.35}
  }
  @media (prefers-reduced-motion:reduce){ .tour img{transition:none} }
</style>
</head>
<body>
<main class="splash">
  <p class="welcome">WELCOME TO</p>
  <h1 style="margin:0"><img class="logo" src="img/yatstats-wordmark-white.png" width="1400" height="243" alt="YAT?STATS"></h1>
  <p class="tagline">TOUR OUR ONLINE BASEBALL COMMUNITIES</p>

  <h2 class="fit">WHERE DO YOU FIT IN?</h2>
  <div class="tours-area">
  <ul class="tours">
    <li><a class="tour" href="programs/"><img src="img/tour-coach.jpg" alt=""><span>High School<br><span class="nw">Baseball Coach/</span><br><span class="nw">Booster Club</span></span></a></li>
    <li><a class="tour" href="players/"><img src="img/tour-player.jpg" alt=""><span>Pro/College<br>Active Alumni <span class="nw">Baseball Player</span></span></a></li>
    <li><a class="tour" href="partners/"><img src="img/tour-partner.jpg" alt=""><span>Community Partner<br>Alumni Sponsor</span></a></li>
    <li><a class="tour" href="fans/"><img src="img/tour-fan.jpg" alt=""><span>Family/Fan</span></a></li>
  </ul>
  </div>
</main>
</body>
</html>
